services:
  trainer:
    build: .
    command: ["python", "-m", "src.models.train_job"]
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    env_file:
      - .env
    profiles: ["train"]  # run explicitly: docker compose --profile train run trainer

  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
