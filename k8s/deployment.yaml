apiVersion: apps/v1
kind: Deployment
metadata:
  name: netanomaly-api
  labels:
    app: netanomaly-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: netanomaly-api
  template:
    metadata:
      labels:
        app: netanomaly-api
    spec:
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
        fsGroup: 1000
      initContainers:
        - name: fetch-models
          image: ghcr.io/OWNER/netanomaly-api:latest
          command: ["python", "-m", "src.models.sync", "--pull", "--wait", "--timeout", "900"]
          envFrom:
            - configMapRef:
                name: netanomaly-config
            - secretRef:
                name: netanomaly-secrets
                optional: true
          volumeMounts:
            - name: models
              mountPath: /app/models
      containers:
        - name: api
          image: ghcr.io/OWNER/netanomaly-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: netanomaly-config
            - secretRef:
                name: netanomaly-secrets
                optional: true
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: models
              mountPath: /app/models
              readOnly: true
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: netanomaly-models
