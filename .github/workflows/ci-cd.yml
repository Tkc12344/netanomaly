name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check src tests

      - name: Run tests
        run: pytest tests/ -q

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR repository names must be lowercase (github.repository keeps owner case).
      - name: Lowercase image name
        run: echo "IMAGE_NAME=$(echo "ghcr.io/${GITHUB_REPOSITORY}/netanomaly-api" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        run: echo "IMAGE_NAME=$(echo "ghcr.io/${GITHUB_REPOSITORY}/netanomaly-api" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        id: kube
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "KUBE_CONFIG secret not set; skipping cluster apply"
            echo "has_kube=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          echo "has_kube=true" >> "$GITHUB_OUTPUT"

      - name: Apply manifests and roll out image
        if: steps.kube.outputs.has_kube == 'true'
        run: |
          (
            cd k8s
            kubectl kustomize . | \
              sed "s|ghcr.io/OWNER/netanomaly-api:latest|${IMAGE_NAME}:${GITHUB_SHA}|g"
          ) | kubectl apply -f -
          kubectl rollout status deployment/netanomaly-api --timeout=180s
